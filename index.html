<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Inkwell Blog</title>
  <meta name="description" content="Inkwell is a responsive blog application built with HTML, CSS and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="index.html"><span>Inkwell</span></a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="container">
        <h1>Write it down. <em>Share it.</em></h1>
        <p>Inkwell is a simple place to publish your ideas, keep your drafts tidy and read what others are writing.</p>
        <div class="actions">
          <a class="btn" href="register.html">Start writing</a>
          <a class="btn btn-ghost" href="#latest">Read latest posts</a>
        </div>
      </div>
    </section>
    <section class="section" id="latest">
      <div class="container">
        <div class="section-head"><h2>Latest posts</h2></div>
        <div class="grid" id="blogGrid"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><span>&copy; <span id="year"></span> Inkwell Blog</span><span>Built during the Codomax Digital Solutions internship</span></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
