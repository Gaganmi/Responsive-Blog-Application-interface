<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create blog | Inkwell Blog</title>
  <meta name="description" content="Inkwell is a responsive blog application built with HTML, CSS and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="create">
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="index.html"><span>Inkwell</span></a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
  </header>
  <main>
    <div class="container auth-wrap">
      <section class="panel wide">
        <h1>Create a blog post</h1>
        <p class="sub">Write your story, pick a category and publish.</p>
        <div class="form-msg" id="formMsg" role="alert"></div>
        <form id="blogForm" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" maxlength="100" required>
            <div class="error">Give your post a title.</div>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Choose a category</option>
              <option>Technology</option><option>Lifestyle</option><option>Travel</option>
              <option>Education</option><option>Food</option><option>Other</option>
            </select>
            <div class="error">Pick a category.</div>
          </div>
          <div class="field">
            <label for="content">Content</label>
            <textarea id="content" name="content" required minlength="50"></textarea>
            <div class="hint"><span>At least 50 characters.</span><span id="counter">0 characters</span></div>
            <div class="error">Write at least 50 characters.</div>
          </div>
          <button class="btn" type="submit">Publish post</button>
        </form>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container"><span>&copy; <span id="year"></span> Inkwell Blog</span><span>Built during the Codomax Digital Solutions internship</span></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
