<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Inkwell Blog</title>
  <meta name="description" content="Inkwell is a responsive blog application built with HTML, CSS and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="index.html"><span>Inkwell</span></a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="dash-head">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="meta" id="welcome"></p>
        </div>
        <a class="btn" href="create-blog.html">New blog post</a>
      </div>
      <div class="stats">
        <div class="stat"><b id="statPosts">0</b><span>Posts published</span></div>
        <div class="stat"><b id="statWords">0</b><span>Words written</span></div>
        <div class="stat"><b id="statCats">0</b><span>Categories used</span></div>
      </div>
      <div class="section-head"><h2>Your posts</h2></div>
      <div class="grid" id="myBlogs"></div>
    </div>
    <div style="height:3rem"></div>
  </main>
  <footer class="site-footer">
    <div class="container"><span>&copy; <span id="year"></span> Inkwell Blog</span><span>Built during the Codomax Digital Solutions internship</span></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
