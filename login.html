<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Inkwell Blog</title>
  <meta name="description" content="Inkwell is a responsive blog application built with HTML, CSS and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="index.html"><span>Inkwell</span></a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
  </header>
  <main>
    <div class="container auth-wrap">
      <section class="panel">
        <h1>Welcome back</h1>
        <p class="sub">Log in to manage your posts.</p>
        <div class="form-msg" id="formMsg" role="alert"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <div class="error">Enter a valid email address.</div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
            <div class="error">Password must be at least 6 characters.</div>
          </div>
          <button class="btn" type="submit">Log in</button>
        </form>
        <p class="switch">New here? <a href="register.html">Create an account</a></p>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container"><span>&copy; <span id="year"></span> Inkwell Blog</span><span>Built during the Codomax Digital Solutions internship</span></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
